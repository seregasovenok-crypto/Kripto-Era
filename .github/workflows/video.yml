name: Видео для TikTok

on:
  schedule:
    # каждый день в 20:30 по Москве (UTC+3): дайджест главных новостей дня
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      news:
        description: "Сколько новостей в ролике"
        default: "3"
  pull_request:
    paths: ["video.py", "requirements-video.txt", ".github/workflows/video.yml"]

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core
      - run: pip install -r requirements-video.txt
      - run: python video.py
        env:
          VIDEO_NEWS: ${{ github.event.inputs.news || '3' }}
          # в PR только собираем тестовый ролик, ничего не отправляем
          VIDEO_SEND: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_VIDEO_CHAT: ${{ secrets.TELEGRAM_VIDEO_CHAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-video
          path: out/
          retention-days: 14
      - name: Положить свежий ролик в ветку videos (скачивать прямо с GitHub)
        run: |
          mkdir -p /tmp/pub && cp out/*.mp4 /tmp/pub/latest.mp4 && cp out/caption.txt /tmp/pub/caption.txt
          cd /tmp/pub
          git init -q -b videos
          git config user.name "kripto-era-bot"
          git config user.email "kripto-era-bot@users.noreply.github.com"
          printf '# Свежий ролик для TikTok\n\n[Скачать latest.mp4](latest.mp4) → кнопка «Download raw file».\nОписание и хэштеги: [caption.txt](caption.txt)\n' > README.md
          git add -A && git commit -q -m "Ролик $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" videos
